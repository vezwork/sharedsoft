<style>

    /* Automatically supports OS dark/light mode */

  html,

    font-family: system-ui;
    font-size: 20px;
  }

  input,
  select {

    height: 40px;

<div style="display:flex; flex-direction: row; align-items: center; justify-content: space-between;">
  <h1><img src="icon.png" height="40px" style="vertical-align: middle;"> esse-split</h1>
  <button command="show-modal" commandfor="profile-dialog" style="background: none; border: none; cursor: pointer;">
    <img src="whodis.png" height="40px" style="border-radius: 50%;" id="profilePic"></button>
  <dialog id="profile-dialog">
    <h3>My profile</h2>
      <div>
        I am:
        <select id="profileEl">
          <option value="">who dis?</option>
          <option value="elliot">Elliot</option>
          <option value="sharon">Sharon</option>
        </select>
        <script>
          profileEl.value = localStorage.getItem('who')
        </script>
      </div>
      <div>
        My key:
        <input type="text" id="keyEl" size="40" />
      </div>
      <script>
        console.log(localStorage.getItem('key'))
        keyEl.value = localStorage.getItem('key')
        keyEl.addEventListener('change', e => {
          localStorage.setItem('key', keyEl.value)
        })
      </script>
      <br>
      <button id="cleardataEl">DANGER: delete data</button>
      <script>
        cleardataEl.addEventListener('click', e => {
          if (confirm('are you sure you want to delete ALL data?')) {
            localStorage.clear()
            location.reload();
          }
        })
      </script>
      <br><br>
      <br>
      <button commandfor="profile-dialog" command="close">Close</button>
  </dialog>
</div>

<div style="display:none; padding: 10px; gap: 5px; margin: 10px;" id="refreshEl">
  <button id="refreshAppBtn">&#x21bb; refresh app</button>
</div>

<div
  style="display:flex; flex-direction: column;border:1px solid light-dark(#000, #fff); padding: 10px; gap: 5px; margin: 10px;">
  <div>
    <span>category:</span>
    <select id="categoryEl">

          ],
          'Entertainment': [
            'Games',
            'Movies',
            'Music',
            'Sports',
            'Entertainment - Other'
          ],
          'Food and drink': [
            'Dining out',
            'Groceries',
            'Liquor',
            'Food and drink - Other'
          ],
          'Home': [
            'Electronics',
            'Furniture',
            'Household supplies',
            'Maintenance',
            'Mortgage',
            'Pets',
            'Rent',
            'Services',
            'Home - Other'
          ],
          'Life': [
            'Childcare',
            'Clothing',
            'Education',

          ],
          'Transportation': [

          ],

        Object.entries(groupedCategories).forEach(([group, categories]) => {

    </select>
  </div>
  <span>
    name:
    <input type="text" id="nameEl" size="40" />
  </span>
  <span>
    amount:
    <input type="number" id="amountEl" style="width: 80px"></input>
    <input type="text" value="CAD" id="currencyEl" size="4" />
  </span>
  <span>
    date:
    <input type="date" id="dateEl" />
    <script>dateEl.valueAsDate = new Date()</script>
  </span>
  <span>
    paid by:
    <select id="paidByEl">
      <option value="elliot">Elliot</option>
      <option value="sharon">Sharon</option>
    </select>
    who is owed
    1÷<input type="number" value="2" id="splitEl" size="4"> that amount
    <script>
      // Only set the initial paid by if the profile is set. Otherwise let it default to the first value automatically
      const initialWho = localStorage.getItem('who');
      if (initialWho) {
        paidByEl.value = initialWho;
      }
    </script>
  </span>
  <button id="addEl">add expense</button>
  <div
    style="display:none; flex-direction: column;border:1px solid light-dark(#000, #fff); padding: 10px; gap: 5px; margin: 10px;"
    id="validationEl"></div>
</div>
<div
  style="display:flex; flex-direction: column;border:1px solid light-dark(#000, #fff); padding: 10px; gap: 5px; margin: 10px;"
  id="messagesEl"></div>

<script type="module">
  import { onEvent, sendEvent, id, updateState } from "./events.js";

  const profileSrc = () => {
    switch (profileEl.value) {
      case 'elliot':
        return 'elliot.png';
      case 'sharon':
        return 'sharon.png';
      default:
        return 'whodis.png'
    }
  }
  profilePic.src = profileSrc();
  profileEl.addEventListener('change', e => {
    localStorage.setItem('who', profileEl.value)
    profilePic.src = profileSrc();
    updateState();
    if (profileEl.value) {
      paidByEl.value = profileEl.value;
    }
  })

  let state = {
    expenses: [],
  };

  const isStandalone = window.navigator.standalone === true /* iOS */ || window.matchMedia('(display-mode: standalone)').matches /* other */;
  if (isStandalone) {
    refreshEl.style.display = 'flex';
  }
  refreshAppBtn.onclick = () => {
    location.reload();
  }

  const reduce = (events) => {
    state = {
      expenses: [],
    };
    for (const { message: { type, data } } of events) {
      if (type === "add expense") {
        state.expenses.push(data)
      }
    }
    const owing = {}
    for (const { amount, who, currency } of state.expenses) {
      owing[currency] = (owing[currency] ?? 0) + amount * (who === profileEl.value ? -1 : 1)
    }

    const isBalanced = Math.abs(Object.values(owing).reduce((acc, cur) => acc + cur, 0)) <= 0.01

    let oweanceString = '';
    if (isBalanced) {
      oweanceString = `<span style="color:LimeGreen">Settled up! :)</span>`;
    } else {
      for (const [currency, amt] of Object.entries(owing)) {
        if (Math.abs(amt) <= 0.01) continue;
        const oweanceAmount = `${Math.abs(amt).toFixed(2)} ${currency}`;
        if (!profileEl.value) {
          oweanceString += `<div><span style="color:yellow">${oweanceAmount}</span> is owed. Please <button command="show-modal" commandfor="profile-dialog" style="cursor: pointer;">set your profile</button>!</div>`;
        } else {
          const iOwe = amt > 0;
          oweanceString += `<div>I ${iOwe ? "owe" : "am owed"}: <span style="color:${iOwe ? 'red' : 'LimeGreen'}">${oweanceAmount}</span></div>`;
        }
      }

    }

    messagesEl.innerHTML = oweanceString +
      state.expenses.reverse().map(({ name, amount, currency, date, who }) =>
        `<div style="border-bottom:1px solid light-dark(#000, #fff)">
        ${who} is owed ${amount}${currency} for ${name} on ${date}
        </div>`
      ).join('')
  };

  const showValidationIssues = issues => {
    if (issues.length > 0) {
      validationEl.style.display = 'flex';
      validationEl.innerHTML = `oops you messed up a bit...<ul>
    ${issues.map(e => `<li>${e}</li>`).join('')}
      </ul>`;
      return false;
    } else {
      validationEl.style.display = 'none';
      return true;
    }
  }
  const validate = ({ who, amount, currency, category, name, date }) => {
    const issues = [];
    if (!who) {
      issues.push('who paid must be specified')
    }
    const nAmount = Number(amount)
    if (nAmount === null || nAmount === undefined) {
      issues.push('expense amount must be specified')
    }
    if (nAmount === 0) {
      issues.push('amount cannot be 0')
    }
    if (nAmount < 0) {
      issues.push('amount cannot be negative')
    }
    if (!currency) {
      issues.push('currency must be specified')
    }
    if (!category) {
      issues.push('category must be specified')
    }
    if (!name) {
      issues.push('expense name must be specified')
    }
    if (!date) {
      issues.push('date must be specified')
    }

    return issues
  }

  // TODO:
  // - nicknames
  // - 

  onEvent(reduce);

  addEl.onclick = () => {
    const fullAmount = Number(amountEl.value)
    const split = Number(splitEl.value)
    const expenseData = {
      who: paidByEl.value?.trim(),
      amount: (fullAmount / split).toFixed(2),
      currency: currencyEl.value?.trim(),
      category: categoryEl.value?.trim(),
      name: nameEl.value?.trim(),
      date: dateEl.value?.trim(),
      method: { split: split.toFixed(2), fullAmount: fullAmount.toFixed(2) }
    };

    const issues = validate(expenseData)
    if (issues.length > 0) {
      showValidationIssues(issues)
    } else {
      sendEvent({
        type: 'add expense',
        data: expenseData
      })
      // clear the expense fields
      amountEl.value = ''
      nameEl.value = ''
      splitEl.value = '2'
    }
  }

  if (!isStandalone) {
    const csvImportEl = document.createElement('input')
    csvImportEl.accept = 'text/csv'
    csvImportEl.type = 'file'
    document.body.append(csvImportEl)
    csvImportEl.addEventListener("change", async () => {
      if (csvImportEl.files.length === 1) {
        const text = await csvImportEl.files[0].text()
        const lines = parseCSV(text)
        // remove headers and total balance lines
        const contentLines = lines.slice(2)

        for (const line of contentLines) {
          const [date, name, category, fullAmount, currency, sAmt, elAmt] = line
          if (name === 'Total balance') continue
          const who = Number(elAmt) > 0 ? 'elliot' : 'sharon'
          const amount = who === 'elliot' ? elAmt : sAmt
          const eventData = {
            who, amount, currency, category, name, date,
            method: { fullAmount },
          }
          const issues = validate(eventData)
          if (issues.length === 0) {
            sendEvent({
              type: 'add expense',
              data: eventData
            }, true) // true: don't send to server right away!
          } else {
            console.log('error loading line:', line, issues)
          }
        }
        updateState()
      }
    });
  }

  function parseCSV(csvString) {
    let escaping = false
    let inString = false
    const lines = [['']]
    const appendChar = (char) => {
      const line = lines[lines.length - 1]
      line[line.length - 1] += char
    }
    for (let i = 0; i < csvString.length; i++) {
      const char = csvString[i]
      if (inString) {
        if (char === '"')
          if (csvString[i + 1] === '"') {
            appendChar('"')
            i++
          } else
            inString = false
        else
          appendChar(char)
      } else {
        if (char === '\r') { }
        else if (char === '"')
          inString = true
        else if (char === '\n')
          lines.push([''])
        else if (char === ',')
          lines.at(-1).push('')
        else
          appendChar(char)
      }
    }
    return lines
  }
</script>

<script>
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then((persistent) => {
      document.body.append("(await navigator.storage.persist()) ===" + persistent)
    });
  }
</script>
