      whoEl.value = localStorage.getItem('who')

<div
  style="display:flex; flex-direction: column;border:1px solid light-dark(#000, #fff); padding: 10px; gap: 5px; margin: 10px;"
  id="messagesEl"></div>

<script type="module">
  import { onEvent, sendEvent, id } from "./events.js";

  let state = {
    expenses: [],
  };

  const isStandalone = window.navigator.standalone === true /* iOS */ || window.matchMedia('(display-mode: standalone)').matches /* other */;
  if (isStandalone) {
    refreshEl.style.display = 'flex';
  }
  refreshAppBtn.onclick = () => {
    location.reload();
  }

  const reduce = (events) => {
    state = {
      expenses: [],
    };
    for (const { message: { type, data } } of events) {
      if (type === "add expense") {
        state.expenses.push(data)
      }
    }
    const owing = {}
    for (const { amount, split, who, currency } of state.expenses) {
      owing[currency] = (owing[currency] ?? 0) + amount / split * (who === whoEl.value ? -1 : 1)
    }

    console.log(owing)

    const isBalanced = Math.abs(Object.values(owing).reduce((acc, cur) => acc + cur, 0)) <= 0.01

    let oweanceString = '';
    if (isBalanced) {
      oweanceString = `<span style="color:LimeGreen">Settled up! :)</span>`;
    } else {
      for (const [currency, amt] of Object.entries(owing)) {
        if (Math.abs(amt) <= 0.01) continue;
        const iOwe = amt > 0;
        oweanceString += `<div>I ${iOwe ? "owe" : "am owed"}: <span style="color:${iOwe ? 'red' : 'LimeGreen'}">${Math.abs(amt).toFixed(2)} ${currency}</span></div>`;
      }

    }

    messagesEl.innerHTML = oweanceString +
      state.expenses.reverse().map(({ name, amount, currency, date, split, who }) =>
        `<div style="border-bottom:1px solid light-dark(#000, #fff)">
        ${who} paid ${amount}${currency} for ${name} on ${date} and is owed 1÷${split} that amount
        </div>`
      ).join('')
  };

  const isValid = ({ who, amount, currency, category, split, name, date }) => {
    const issues = [];
    if (!who) {
      issues.push('who paid must be specified')
    }
    if (amount === null || amount === undefined) {
      issues.push('expense amount must be specified')
    }
    if (amount === 0) {
      issues.push('amount cannot be 0')
    }
    if (amount < 0) {
      issues.push('amount cannot be negative')
    }
    if (!currency) {
      issues.push('currency must be specified')
    }
    if (!category) {
      issues.push('category must be specified')
    }
    if (split === null || split === undefined) {
      issues.push('split must be specified')
    }
    if (split === 0) {
      issues.push('split cannot be 0')
    }
    if (split < 0) {
      issues.push('split cannot be negative')
    }
    if (!name) {
      issues.push('expense name must be specified')
    }
    if (!date) {
      issues.push('date must be specified')
    }

    if (issues.length > 0) {
      validationEl.style.display = 'flex';
      validationEl.innerHTML = `oops you messed up a bit...<ul>
    ${issues.map(e => `<li>${e}</li>`).join('')}
      </ul>`;
      return false;
    } else {
      validationEl.style.display = 'none';
      return true;
    }
  }

  // TODO:
  // - nicknames
  // - 

  onEvent(reduce);

  addEl.onclick = () => {
    const expenseData = {
      who: whoEl.value?.trim(),
      amount: Number(amountEl.value?.trim()),
      currency: currencyEl.value?.trim(),
      category: categoryEl.value?.trim(),
      split: Number(splitEl.value?.trim()),
      name: nameEl.value?.trim(),
      date: dateEl.value?.trim()
    };

    if (isValid(expenseData)) {
      sendEvent({
        type: 'add expense',
        data: expenseData
      })
      // clear the expense fields
      amountEl.value = ''
      nameEl.value = ''
      splitEl.value = '2'
    }
  }

  if (!isStandalone) {
    const csvImportEl = document.createElement('input')
    csvImportEl.accept = 'text/csv'
    csvImportEl.type = 'file'
    document.body.append(csvImportEl)
    csvImportEl.addEventListener("change", async () => {
      if (csvImportEl.files.length === 1) {
        const text = await csvImportEl.files[0].text()
        const lines = text.split('\n')

        // remove header line
        const contentLines = lines.slice(2)
        for (const line of contentLines) {
          const [date, name, category, amount, currency, elAmt, sAmt] = line.split(',')
          const who = elAmt > 0 ? 'elliot' : 'sharon'
          const split = Number((amount / (who === 'elliot' ? elAmt : sAmt)).toFixed(2))
          const eventData = {
            who,
            amount: Number(amount),
            currency,
            category,
            split,
            name,
            date,
          }
          if (isValid(eventData)) {
            sendEvent({
              type: 'add expense',
              data: eventData
            }, true) // true: don't send to server right away!
          } else {
            console.log('error loading line:', line)
          }
        }
      }
    });
  }
</script>

<script>
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().then((persistent) => {
      document.body.append("(await navigator.storage.persist()) ===" + persistent)
    });
  }
</script>
