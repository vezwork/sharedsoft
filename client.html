<div style="display:flex; flex-direction: column;border:1px solid black; padding: 10px; gap: 5px; margin: 10px;">
    <select id="categoryEl">
        <option value="dining out">dining out</option>
        <option value="grocery">grocery</option>
    </select>
    <span>
        <select id="whoEl">
            <option value="elliot">Elliot</option>
            <option value="sharon">Sharon</option>
        </select>
        <script>
            whoEl.value = localStorage.getItem('who')
            whoEl.addEventListener('change',e=>localStorage.setItem('who', whoEl.value))
        </script>
        payed 
        <input type="number" id="amountEl" style="width: 80px"></input>
        <input type="text" value="CAD" id="currencyEl" size="4"/> 
    </span>
    <span>
        for 
        <input type="text" id="nameEl" size="40"/>
    </span>
    <span>
        on 
        <input type="date" id="dateEl"/>
        <script>dateEl.valueAsDate = new Date()</script>
    </span>
    <span>
        and is owed
        <input type="text" value="0.5" id="splitEl" size="4">× that amount
    </span>
    <label>portion owed: </label>
    <button id="addEl">add expense</button>
</div>
<div style="display:flex; flex-direction: column;border:1px solid black; padding: 10px; gap: 5px; margin: 10px;" id="messagesEl"></div>
<script type="module">
  import { onEvent, sendEvent, id } from "./events.js";

  let state = {
    expenses: [],
  };

  const reduce = (events) => {
    state = {
      expenses: [],
    };
    for (const { message: { type, data }} of events) {
      if (type === "add expense") {
        state.expenses.push(data)
      }
    }
    const owing = state.expenses.reduce(
        (acc,{amount, split, who})=> acc + amount*split*(who===whoEl.value?-1:1),
        0
    )
    messagesEl.innerHTML = state.expenses.reverse().map(({name,amount,split,who})=>
        `<div style="border:1px solid black">
        ${who} - ${name} - <span style="color:blue">$ ${amount}</span> - ${split}
        </div>`
    ).join('') + `I owe <span style="color:${owing>0?'red':'green'}">$ ${owing.toFixed(2)}</span>`
  };

  // TODO:
  // - nicknames
  // - 

  onEvent(reduce);

  addEl.onclick=()=>{
    sendEvent({
        type:'add expense', 
        data: {
            who: whoEl.value,
            amount: Number(amountEl.value), 
            currency: currencyEl.value,
            category: categoryEl.value, 
            split: Number(splitEl.value),
            name: nameEl.value,
            date: dateEl.value
        }
    })
    amountEl.value=''
    nameEl.value=''
    splitEl.value='0.5'
  }
</script>
